[project]
name = "ruregistered-api"
version = "0.1.0"
description = "Course search API for Rutgers (Schedule of Classes + professor ratings)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["ruregistered_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
